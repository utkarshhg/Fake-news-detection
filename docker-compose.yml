# ═══════════════════════════════════════════════════════════════════
# Fake News Detector — Docker Compose (React + FastAPI)
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-detector
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist database across container restarts
      - fake_news_db:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  fake_news_db:
    driver: local
