# ═══════════════════════════════════════════════════════════════════
# Nginx Reverse Proxy for Fake News Detector (React + FastAPI)
# ═══════════════════════════════════════════════════════════════════
# Place this file at: /etc/nginx/conf.d/fake-news-detector.conf
# Then run: sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, use certbot: sudo certbot --nginx -d yourdomain.com
# ═══════════════════════════════════════════════════════════════════

upstream backend_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourdomain.com;  # Replace with your domain or EC2 public IP

    # Redirect HTTP to HTTPS (uncomment after setting up SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # API docs endpoint
    location /docs {
        proxy_pass http://backend_app/docs;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size for article text
    client_max_body_size 10M;
}
